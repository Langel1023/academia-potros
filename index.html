<style>
:root{
  --font-display:"Big Shoulders Display","Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --bg:#F6F4EA;--paper:#FFFFFF;--ink:#111111;--ink-2:#57534A;--rule:#DEDACB;

  --warn:#6A4B00;--warn-wash:#FAE9A8;
  --bad:#B5302A;--bad-wash:#F7D9D5;--bad-solid:#B5302A;
  --shadow:0 10px 30px rgba(10,20,14,.22);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1511;--paper:#15211A;--ink:#E6EEE7;--ink-2:#9BB0A2;--rule:#26372C;
    --kit:#FFC400;--kit-ink:#111111;--kit-wash:#3A3000;--head:#000000;
    --ok:#62CF8F;--ok-wash:#163926;--ok-solid:#237A49;
    --warn:#F2D777;--warn-wash:#3B3212;
    --bad:#FF8A7E;--bad-wash:#431D1A;--bad-solid:#C0453C;
    --shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1511;--paper:#15211A;--ink:#E6EEE7;--ink-2:#9BB0A2;--rule:#26372C;
  --kit:#FFC400;--kit-ink:#111111;--kit-wash:#3A3000;--head:#000000;
  --ok:#62CF8F;--ok-wash:#163926;--ok-solid:#237A49;
  --warn:#F2D777;--warn-wash:#3B3212;
  --bad:#FF8A7E;--bad-wash:#431D1A;--bad-solid:#C0453C;
  --shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ul{margin:0}
h1,h2{font-family:var(--font-display);text-wrap:balance}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--kit);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"top" "main" "nav"}
.top{grid-area:top;background:var(--head);color:#FFC400;border-bottom:4px solid #FFC400}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px;flex:none}
.brand b{display:block;font:900 28px/1 var(--font-display);letter-spacing:.04em}
.brand small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.chipf{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,196,0,.6);background:transparent;color:#FFC400;font-weight:600;font-size:14px}
.chipf[aria-pressed="true"]{background:#FFC400;color:#111;border-color:#FFC400}
.top :focus-visible{outline-color:#fff}
.main{grid-area:main;overflow-y:auto;min-height:0;min-width:0}
.view{max-width:1040px;margin:0 auto;padding-block:16px 32px;display:grid;gap:14px;align-content:start}
.nav{grid-area:nav;display:flex;background:var(--paper);border-top:1px solid var(--rule)}
.nav button{flex:1;min-width:0;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;background:transparent;color:var(--ink-2);font-size:12px;font-weight:600}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--kit)}
@media (min-width:900px){
  .app{grid-template-columns:216px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top" "nav main"}
  .nav{flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--rule);padding:14px 10px}

  .nav button[aria-current="page"]{background:var(--kit-wash)}
}

.btn{min-height:44px;padding:0 16px;border-radius:9px;border:1px solid var(--rule);background:var(--paper);font-weight:600}
.btn.pri{background:var(--kit);color:var(--kit-ink);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn.icon{min-width:44px;padding:0;font-size:22px;line-height:1}
.btn[disabled]{opacity:.5;cursor:default}
.chip{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.03em;background:var(--kit-wash);color:var(--kit);white-space:nowrap}

.fld>span{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}

.row:has(>.who:first-child){grid-template-columns:minmax(0,1fr) auto}
.who{display:grid;gap:1px;min-width:0}
.nm{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--ink-2)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--paper)}
.seg.wide{display:flex}
.seg button{flex:1;min-width:60px;min-height:46px;padding:0 10px;border:0;background:transparent;font-weight:600;font-size:15px}
.seg button+button{border-left:1px solid var(--rule)}
.seg .s[aria-pressed="true"]{background:var(--kit);color:var(--kit-ink)}
.chk{min-width:115px;min-height:48px;padding:0 14px;border-radius:10px;border:1.5px solid var(--kit);background:transparent;color:var(--kit);font-weight:700;font-size:15px;transition:all 0.15s ease}
.chk[aria-pressed="true"]{background:var(--ok-solid);border-color:var(--ok-solid);color:#fff}

.amt{display:grid;justify-items:end;line-height:1.05;text-align:right}
.amt b{font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.amt small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.amt.bad b{color:var(--bad)}
.amt.ok b{color:var(--ok)}
.amt.zero b{font:700 15px/1.2 var(--font-body)}
.note{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:10px 14px;border-radius:10px;background:var(--warn-wash);color:var(--warn);font-size:14px;font-weight:500}
.note.info{background:var(--kit-wash);color:var(--kit)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-2);display:grid;gap:10px;justify-items:center;border:1px dashed var(--rule);border-radius:10px}

.cat{display:grid;gap:8px}
.cat-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;padding:14px 2px 6px;border-bottom:2px solid var(--kit);font:900 26px/1 var(--font-display);letter-spacing:.04em;text-transform:uppercase}
.cat-h>span{white-space:nowrap}
.cat-h small{margin-left:auto;font:600 13px/1.2 var(--font-body);letter-spacing:0;text-transform:none;color:var(--ink-2);text-align:right}
@media (max-width:480px){.cat-h{font-size:22px}}
.cat-h small.bad{color:var(--bad);font-weight:700}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;width:20px;height:20px;transform:translateY(-50%);fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linecap:round;pointer-events:none}
.search input{width:100%;min-height:50px;padding:0 48px 0 44px;border:1px solid var(--rule);border-radius:12px;background:var(--paper);font-size:16px}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search .x{position:absolute;right:4px;top:50%;width:42px;height:42px;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-2);font-size:26px;line-height:1}
.cols{display:grid;gap:18px}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start}}
.day{font:800 20px/1.1 var(--font-display);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);padding-top:6px}
.day.hoy{color:var(--kit)}
.hora{min-width:58px;font:800 28px/1 var(--font-display);font-variant-numeric:tabular-nums}
.panel{display:grid;gap:12px;padding:14px;background:var(--paper);border:1px solid var(--rule);border-radius:12px}
.panel h2{font-size:24px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}
.msg{width:100%;min-height:220px;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);font:15px/1.5 var(--font-body);resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
dialog{border:0;padding:0;border-radius:14px;width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--paper);color:var(--ink);box-shadow:var(--shadow);overflow:auto}

.balance.ok b{color:var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.tile b{font:800 26px/1 var(--font-display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.dact{display:flex;flex-wrap:wrap;gap:8px}
.dlg h3{font:800 18px/1 var(--font-display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.mvs,.wk{list-style:none;padding:0;margin:0;display:grid}
.mvs li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.wk li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.mv-n{color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.mvs b{font-variant-numeric:tabular-nums}
.mvs b.pago{color:var(--ok)}
.mvs b.cargo{color:var(--bad)}
.linkbtn{border:0;background:transparent;color:var(--kit);font-weight:600;font-size:14px;min-height:36px;padding:0 4px}
.err{color:var(--bad);font-weight:600;font-size:14px}
@media (max-width:600px){
  dialog{margin:auto 0 0;width:100%;max-width:none;border-radius:16px 16px 0 0}
  .dlg{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:50;width:fit-content;max-width:calc(100% - 32px);margin-inline:auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:10px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);font-size:15px;font-weight:500}
.toast .tbtn{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;min-height:36px;padding:0 4px}
@media (min-width:900px){.toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
</style>

<script>
'use strict';

  apiKey: "AIzaSyCeOUQgSmDkkbzN7jb7x6hJpRZ657OPZIU",

  {id:'langel', email:'langel101206@gmail.com', pass:'Potrosriberas', n:'Luis Angel', r:'Administrador'}

const TARIFA_DEF=120;
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DIAS_C=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MESES_C=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const hoy=()=>iso(new Date());
const lunes=s=>addDays(s,-((parse(s).getDay()+6)%7));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fLarga=s=>{const d=parse(s);return cap(DIAS[d.getDay()])+' '+d.getDate()+' de '+MESES[d.getMonth()];};
const fCorta=s=>{const d=parse(s);return DIAS_C[d.getDay()]+' '+d.getDate()+' '+MESES_C[d.getMonth()];};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(Math.round(n*100)/100).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
const horaTxt=h=>{const m=/^(\d{1,2}):(\d{2})$/.exec(h||'');return m?(+m[1])+':'+m[2]:'';};
const natural=(a,b)=>String(a).localeCompare(String(b),'es',{numeric:true});
const norm=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const cmpCat=(a,b)=>a===b?0:!a?1:!b?-1:natural(a,b);
const catLabel=c=>c?'Categoría '+c:'Sin categoría';
const plural=(n,u,p)=>n+' '+(n===1?u:p);

function porCat(items,cat){
  const m=new Map();
  for(const x of items){const c=cat(x)||'';if(!m.has(c))m.set(c,[]);m.get(c).push(x);}
  return[...m.entries()].sort((a,b)=>cmpCat(a[0],b[0]));
}
const $=(s,r)=>(r||document).querySelector(s);

function rango(tipo,base){
  const wd=parse(base).getDay();
  if(tipo==='todo')return{desde:base,hasta:'9999-12-31'};
  if(tipo==='finde'){
    if(wd===0)return{desde:base,hasta:base};
    if(wd===6)return{desde:base,hasta:addDays(base,1)};
    const sab=addDays(base,6-wd);
    return{desde:sab,hasta:addDays(sab,1)};
  }
  return{desde:base,hasta:addDays(base,6)};
}
function rangoTexto(tipo,desde,hasta){
  if(tipo==='todo')return'Próximos juegos';
  if(desde===hasta)return fLarga(desde);
  const a=parse(desde),b=parse(hasta);
  if(a.getMonth()===b.getMonth())return'Del '+a.getDate()+' al '+b.getDate()+' de '+MESES[b.getMonth()];
  return'Del '+a.getDate()+' de '+MESES[a.getMonth()]+' al '+b.getDate()+' de '+MESES[b.getMonth()];
}

function buildRol(o){
  const r=rango(o.tipo,o.base);
  const list=o.partidos.filter(p=>p.fecha>=r.desde&&p.fecha<=r.hasta&&(!o.cat||p.categoria===o.cat))
    .sort((a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
  if(!list.length)return'';
  const out=['⚽ *Rol de juegos · '+o.club+'*','_'+rangoTexto(o.tipo,r.desde,r.hasta)+'_'];
  const cats=[...new Set(list.map(p=>p.categoria||''))].sort(cmpCat);
  for(const c of cats){
    out.push('','*'+catLabel(c)+'*');
    for(const p of list.filter(x=>(x.categoria||'')===c)){
      const h=horaTxt(p.hora);
      out.push('• '+[cap(fCorta(p.fecha)),h?h+' hrs':'',p.rival?'vs '+p.rival:'',p.sede||''].filter(Boolean).join(' · '));
    }
  }
  if(o.nota&&o.nota.trim())out.push('',o.nota.trim());
  return out.join('\n');
}

function cuentas(){
  const m=new Map();
  const g=id=>{let c=m.get(id);if(!c){c={cobrado:0,pagado:0,asis:0,saldo:0};m.set(id,c);}return c;};
  D.asis.forEach((d,id)=>{const s=(d&&d.semanas)||{};for(const k in s){const v=+s[k];if(v>0){const c=g(id);c.cobrado+=v;c.asis++;}}});

}

const filaLibro=(e,id,quitar)=>{
  const pago=e.tipo==='pago';
  const txt=e.origen==='asistencia'?'Asistencia · '+semanaTxt(e.semana).replace(/^Del /,'semana del '):(e.fecha?fCorta(e.fecha):'')+(e.nota?' · '+e.nota:'');
  return'<li><span class="mv-n">'+esc(txt)+'</span><b class="'+(pago?'pago':'cargo')+'">'+(pago?'−':'+')+money(e.monto)+'</b>'
    +(quitar?'<button type="button" class="linkbtn" data-dact="mvQuitar" data-id="'+esc(id)+'" data-origen="'+e.origen+'" data-mid="'+esc(e.mid||'')+'" data-sem="'+esc(e.semana||'')+'">Quitar</button>':'')+'</li>';
};
function pagoDlg(id){
  const j=D.jug.find(x=>x.id===id);if(!j)return;
  const s=cuentaDe(cuentas(),id).saldo,mv=libro(id);
  abrir('<form class="dlg" data-kind="mov" data-id="'+esc(id)+'" autocomplete="off">'
    +'<div class="dh"><div><h2>'+esc(j.nombre)+'</h2><p class="sub">'+esc(catLabel(j.categoria))+'</p></div><button type="button" class="btn icon" data-dact="cerrar" aria-label="Cerrar">×</button></div>'
    +'<div class="balance '+(s>0?'bad':'ok')+'"><span>'+(s>0?'Debe':s<0?'A favor':'Al corriente')+'</span><b>'+money(Math.abs(s))+'</b></div>'
    +'<div class="grid2"><label class="fld"><span>Monto</span><input id="fMonto" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>'
    +'<label class="fld"><span>Fecha</span><input id="fFecha" type="date" value="'+hoy()+'"></label></div>'
    +'<label class="fld"><span>Nota (opcional)</span><input id="fNota" type="text" maxlength="80" placeholder="Ej. uniforme, torneo, pago de la semana"></label>'

    +(s>0?'<button type="button" class="btn ghost" data-dact="todo" data-v="'+s+'">Pagar todo ('+money(s)+')</button>':'')+'</div>'
    +'<h3>Últimos movimientos</h3>'
    +(mv.length?'<ul class="mvs">'+mv.slice(0,10).map(e=>filaLibro(e,id,true)).join('')+'</ul>':'<p class="sub">Todavía no hay movimientos.</p>')
    +(mv.length>10?'<p class="sub">Se muestran los 10 más recientes. Todo el detalle está en Historial.</p>':'')
    +'</form>');
}
async function registrarMov(tipo){
  const f=$('#dlg form'),monto=parseFloat($('#fMonto').value);
  if(!(monto>0)){dError('Escribe un monto mayor a 0.');return;}
  if(tipo==='pago'){const s=cuentaDe(cuentas(),f.dataset.id).saldo;if(monto>s+0.004){dError(s>0?'Solo se puede pagar lo que debe: '+money(s)+'.':'Este jugador está al corriente, no debe nada.');return;}}
  const d={jugadorId:f.dataset.id,tipo,monto:Math.round(monto*100)/100,fecha:$('#fFecha').value||hoy(),nota:$('#fNota').value.trim(),ts:Date.now(),por:S.user};
  const j=D.jug.find(x=>x.id===d.jugadorId);
  let ref=null;
  const ok=await escribir(async()=>{ref=await S.db.collection('movimientos').add(d);});
  if(!ok)return;
  cerrar();
  toast((tipo==='pago'?'Pago de ':'Cargo de ')+money(d.monto)+(j?' · '+j.nombre:''),()=>escribir(()=>ref.delete()));
}

dacts.mvQuitar=async t=>{

  const ok=await escribir(()=>t.dataset.origen==='asistencia'?marcar(id,sem,null):S.db.doc('movimientos/'+mid).delete());

  const t=hoy(),r=(l,d,x)=>'<button class="btn sm" data-act="hrango" data-d="'+d+'" data-h="'+x+'" aria-pressed="'+(S.hd===d&&S.hh===x)+'">'+l+'</button>';
  return h+'<div class="acts">'+r('Todo','','')+r('Hoy',t,t)+r('Últimos 7 días',addDays(t,-6),t)+r('Este mes',t.slice(0,8)+'01',t)+'</div>'

function lHist(){
  const out=[];
  for(const j of D.jug)if(enCat(j)&&coincide(j))for(const e of libro(j.id))out.push(Object.assign({j},e));
  const ver=out.filter(e=>(!S.hd||e.fecha>=S.hd)&&(!S.hh||e.fecha<=S.hh)).sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||(b.ts||0)-(a.ts||0));
  if(!ver.length)return S.q.trim()?sinResultados():aviso('Sin movimientos','No hay movimientos en estas fechas.');
  const pg=ver.filter(e=>e.tipo==='pago').reduce((a,e)=>a+e.monto,0),cg=ver.filter(e=>e.tipo!=='pago').reduce((a,e)=>a+e.monto,0);
  return'<div class="score"><div><b class="ok">'+money(pg)+'</b><span>Pagado</span></div><div><b>'+money(cg)+'</b><span>Cobrado</span></div><div><b>'+ver.length+'</b><span>Movimientos</span></div></div>'
    +'<div class="list">'+ver.slice(0,200).map(e=>{
      const pago=e.tipo==='pago',asis=e.origen==='asistencia',u=USERS.find(x=>x.id===e.por);
      return'<button class="row" data-act="histAbrir" data-id="'+esc(e.j.id)+'">'+dorsalTile(e.j)+'<span class="who"><span class="nm">'+esc(e.j.nombre)+'</span><span class="sub">'+esc((e.fecha?fCorta(e.fecha):'')+' · '+(asis?'Asistencia de la semana':(pago?'Pago':'Cargo')+(e.nota?' · '+e.nota:''))+(u?' · '+u.n.split(' ')[0]:''))+'</span></span>'
        +'<span class="amt '+(pago?'ok':'bad')+'"><b>'+(pago?'−':'+')+money(e.monto)+'</b><small>'+(pago?'Pago':asis?'Cuota':'Cargo')+'</small></span></button>';
    }).join('')+'</div>'
    +(ver.length>200?'<p class="sub">Se muestran los 200 más recientes; usa las fechas para acotar.</p>':'');
}
acts.hrango=t=>{S.hd=t.dataset.d;S.hh=t.dataset.h;draw();};
function histDlg(id){
  const j=D.jug.find(x=>x.id===id);if(!j)return;
  const c=cuentaDe(cuentas(),id),s=c.saldo,act=semanaActual();
  const movs=libro(id).filter(e=>e.origen==='manual');
  const inicio=[j.alta?lunes(j.alta):'',...semanasDe(id).map(x=>x[0]),...movs.filter(e=>e.fecha).map(e=>lunes(e.fecha))].filter(Boolean).sort()[0]||act;
  const sems=[];
  for(let w=act;w>=inicio&&sems.length<52;w=addDays(w,-7))sems.push(w);
  const cortado=sems.length&&addDays(sems[sems.length-1],-7)>=inicio;
  const fila=w=>{
    const m=montoSem(id,w);
    return'<li><span class="mv-n">'+esc(semanaTxt(w))+'</span>'+(m>0?'<span class="chip ok">Vino · +'+money(m)+'</span>':'<span class="chip mute">'+(w===act?'Sin marcar':'No vino')+'</span>')+'</li>';
  };
  abrir('<div class="dlg">'
    +'<div class="dh"><div><h2>'+esc(j.nombre)+'</h2><p class="sub">'+esc(catLabel(j.categoria))+(j.activo===false?' · Baja':'')+(j.tutor?' · '+esc(j.tutor):'')+'</p></div><button type="button" class="btn icon" data-dact="cerrar" aria-label="Cerrar">×</button></div>'
    +'<div class="balance '+(s>0?'bad':'ok')+'"><span>'+(s>0?'Debe':s<0?'A favor':'Al corriente')+'</span><b>'+money(Math.abs(s))+'</b></div>'
    +'<div class="tiles"><div class="tile"><b>'+c.asis+'</b><span>Asistencias</span></div><div class="tile"><b>'+money(c.cobrado)+'</b><span>Cobrado</span></div><div class="tile"><b>'+money(c.pagado)+'</b><span>Pagado</span></div></div>'
    +'<div class="dact"><button type="button" class="btn pri" data-dact="irPagos" data-id="'+esc(id)+'">Registrar pago</button></div>'
    +'<h3>Asistencias por semana</h3><ul class="wk">'+sems.map(fila).join('')+'</ul>'
    +(cortado?'<p class="sub">Se muestran las últimas 52 semanas.</p>':'')
    +'<h3>Pagos y cargos</h3>'
    +(movs.length?'<ul class="mvs">'+movs.slice(0,30).map(e=>filaLibro(e,id,false)).join('')+'</ul>':'<p class="sub">Todavía no hay pagos ni cargos registrados.</p>')
    +'</div>');
}

const cmpP=(a,b)=>(a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||''));
function grupos(list){
  const base=hoy();let h='';
  for(const [c,arr] of porCat(list,p=>p.categoria)){
    h+='<section class="cat" aria-label="'+esc(catLabel(c))+'"><h2 class="cat-h"><span>'+esc(catLabel(c))+'</span><small>'+arr.length+(arr.length===1?' juego':' juegos')+'</small></h2><div class="list">';
    let last='';
    for(const p of arr){
      if(p.fecha!==last){
        last=p.fecha;
        h+='<h3 class="day'+(p.fecha===base?' hoy':'')+'">'+esc(fLarga(p.fecha))+(p.fecha===base?' · hoy':p.fecha===addDays(base,1)?' · mañana':'')+'</h3>';
      }
      h+='<button class="row" data-act="parEd" data-id="'+esc(p.id)+'"><span class="hora">'+(esc(horaTxt(p.hora))||'–')+'</span>'
        +'<span class="who"><span class="nm">'+esc(p.rival?'vs '+p.rival:'Juego')+'</span><span class="sub">'+esc(p.sede||'Sede por confirmar')+'</span></span>'
        +'<span></span></button>';
    }
    h+='</div></section>';
  }
  return h;
}

    +'<button class="btn pri" data-act="copiar"'+(msg?'':' disabled')+'>Copiar para WhatsApp</button></section>';
  return'<div class="bar"><div><h1>Rol de juegos</h1><p class="sub">Captura el rol una vez y copia el mensaje, ya dividido por categoría, para el grupo de papás.</p></div><div class="acts"><button class="btn pri" data-act="parNuevo">Agregar juego</button></div></div>'

acts.copiar=async()=>{
  const ta=$('#msg');if(!ta||!ta.value)return;
  const bien=()=>toast('Mensaje copiado. Pégalo en el grupo de WhatsApp.');
  try{await navigator.clipboard.writeText(ta.value);bien();}
  catch(e){
    ta.focus();ta.select();
    try{if(document.execCommand('copy')){bien();return;}}catch(_){}
    toast('Selecciona el texto y cópialo manualmente.');
  }
};

dacts.enviar_jug=async f=>{
  const nombre=$('#jNombre').value.trim();
  if(!nombre){dError('Escribe el nombre del jugador.');return;}
  const d={nombre,categoria:$('#jCat').value.trim(),tutor:$('#jTutor').value.trim(),telefono:$('#jTel').value.trim()};
  const id=f.dataset.id,debe=$('#jDebe')?parseFloat($('#jDebe').value):0;
  const ok=await escribir(async()=>{
    if(id)await S.db.doc('jugadores/'+id).update(d);
    else{
      const ref=await S.db.collection('jugadores').add(Object.assign({activo:true,alta:hoy()},d));
      if(debe>0)await S.db.collection('movimientos').add({jugadorId:ref.id,tipo:'cargo',monto:Math.round(debe*100)/100,fecha:hoy(),nota:'Saldo inicial',ts:Date.now()});

  });
  if(ok){cerrar();toast(id?'Cambios guardados.':'Jugador agregado.');}
};

dacts.enviar_var=async()=>{
  const rawText=$('#vNombres').value;
  const nombres=rawText.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!nombres.length){dError('Escribe al menos un nombre.');return;}
  const cat=$('#vCat').value.trim();
  const submitBtn=$('#btnVarSubmit');
  if(submitBtn){submitBtn.disabled=true;submitBtn.textContent='Guardando…';}

  const ok=await escribir(async()=>{
    let batch=S.db.batch();
    let count=0;
    for(const n of nombres){
      const docRef=S.db.collection('jugadores').doc();
      batch.set(docRef,{
        nombre:n.slice(0,80),
        categoria:cat,
        dorsal:null,
        tutor:'',
        telefono:'',
        activo:true,
        alta:hoy()
      });
      count++;
      if(count%400===0){
        await batch.commit();
        batch=S.db.batch();
      }
    }
    if(count%400!==0){
      await batch.commit();
    }
  });

  if(ok){cerrar();toast('Agregaste '+plural(nombres.length,'jugador.','jugadores.'));}
  else if(submitBtn){submitBtn.disabled=false;submitBtn.textContent='Agregar jugadores';}
};

acts.ejBorrar=async()=>{
  if(S.confirm!=='ej'){
    S.confirm='ej';draw();
    setTimeout(()=>{if(S.confirm==='ej'){S.confirm='';draw();}},4000);
    return;
  }
  S.confirm='';
  const ok=await escribir(async()=>{
    const de=(col,list)=>list.filter(x=>x.ejemplo).map(x=>S.db.doc(col+'/'+x.id));
    const as=[];D.asis.forEach((d,id)=>{if(d&&d.ejemplo)as.push(S.db.doc('asistencia/'+id));});
    const refs=[].concat(de('movimientos',D.movs),de('partidos',D.part),de('jugadores',D.jug),as);
    for(const r of refs)await r.delete();
  });
  draw();
  if(ok)toast('Ejemplos borrados. Ya puedes empezar con tus jugadores.');
};

  +'<label class="fld"><span>Correo electrónico</span><input id="lU" type="email" autocomplete="email" required placeholder="correo@ejemplo.com"></label>'
  +'<label class="fld"><span>Contraseña</span><input id="lP" type="password" autocomplete="current-password" required></label>'
  +'<p class="err" id="lE" role="alert" hidden></p><button type="submit" class="btn pri">Entrar</button></form>';

dacts.enviar_login=async()=>{
  const email=$('#lU').value.trim().toLowerCase();
  const pass=$('#lP').value;
  const p=$('#lE');
  const match=USERS.find(u=>u.email.toLowerCase()===email&&u.pass===pass);
  if(!match){
    p.textContent='Correo o contraseña incorrectos.';
    p.hidden=false;
    return;
  }
  S.user=match.id;
  guardarPref();
  p.hidden=true;
  iniciarSesionApp();
};

acts.salir=()=>{
  S.user='';
  guardarPref();
  draw();
};

function iniciarSesionApp(){
  S.conn='listo';
  S.canWrite=true;
  if(S.ready.size===0){
    suscribir();
  }
  draw();
}

(function boot(){
  S.db=firestoreDb;
  S.conn='listo';
  if(S.user){
    iniciarSesionApp();
  }else{
    draw();
  }
})();
